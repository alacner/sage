<h2>Page Report</h2><input id="url" value="https://example.com"><button id="run">Read page</button><pre id="out"></pre><script>document.getElementById('run').onclick=async()=>{try{document.getElementById('out').textContent=JSON.stringify(await sage.call('report','read',{url:document.getElementById('url').value}),null,2);}catch(e){document.getElementById('out').textContent=e.message;}};</script>
