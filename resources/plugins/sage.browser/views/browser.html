<h2>Browser Automation</h2><input id="url" value="https://example.com"><button id="open">Open</button><button id="snapshot">Snapshot</button><button id="close">Close</button><pre id="out"></pre><script>
let page;const out=document.getElementById('out');document.getElementById('open').onclick=async()=>{try{page=await sage.call('automation','create',{url:document.getElementById('url').value});await sage.call('automation','show',page);out.textContent=JSON.stringify(page);}catch(e){out.textContent=e.message;}};document.getElementById('snapshot').onclick=async()=>{try{out.textContent=JSON.stringify(await sage.call('automation','snapshot',page),null,2);}catch(e){out.textContent=e.message;}};document.getElementById('close').onclick=async()=>{try{await sage.call('automation','close',page);out.textContent='Closed';}catch(e){out.textContent=e.message;}};</script>
