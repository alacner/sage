<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>测试页面</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .card { background: rgba(255,255,255,0.15); padding: 30px; border-radius: 12px; max-width: 400px; }
    h1 { margin: 0 0 10px 0; }
    button { background: white; color: #667eea; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 HTML 预览测试</h1>
    <p>这个页面会直接在 Sage 中渲染预览。</p>
    <p>CSS 渐变背景、卡片样式、按钮交互都可以正常显示。</p>
    <button onclick="alert('Hello from iframe!')">点击测试</button>
  </div>
</body>
</html>
